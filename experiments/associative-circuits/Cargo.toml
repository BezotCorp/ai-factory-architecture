[package]
name = "associative-circuits-experiment"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = ["cuda"]
cuda = ["candle-core/cuda"]

[dependencies]
anyhow = "1"
associative-circuits = { path = "../../brains/associative-circuits" }
massive-loader = { path = "../../datasets/massive/loader" }
massive-intents = { path = "../../datasets/massive/intents" }
csv = "1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
serde_json = "1"

[[bin]]
name = "associative-circuits"
path = "src/main.rs"

[[bin]]
name = "massive"
path = "src/bin/massive.rs"
